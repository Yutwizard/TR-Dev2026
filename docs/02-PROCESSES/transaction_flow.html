<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Flow Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Animation classes */
        .animate-in {
            animation-duration: 0.5s;
            animation-fill-mode: both;
        }
        .fade-in {
            animation-name: fadeIn;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Mermaid diagram styling */
        .mermaid {
            display: flex;
            justify-content: center;
        }
        .mermaid svg {
            max-width: 100%;
            height: auto;
        }
        
        /* Print styles for PDF export */
        @media print {
            /* Hide sidebar and header elements */
            aside, 
            header button,
            header .hidden.lg\\:flex,
            header .h-8.w-px,
            header div.rounded-full {
                display: none !important;
            }
            
            /* Expand main content to full width */
            .flex-1.flex.flex-col {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            /* Remove overflow restrictions */
            .overflow-hidden,
            .overflow-y-auto {
                overflow: visible !important;
                height: auto !important;
            }
            
            /* Ensure all content is visible */
            main {
                max-height: none !important;
                overflow: visible !important;
            }
            
            /* Page breaks for diagrams */
            .mermaid {
                page-break-inside: avoid;
                break-inside: avoid;
                margin: 20px 0;
            }
            
            section {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            
            /* Ensure diagrams fit on page */
            .mermaid svg {
                max-width: 100% !important;
                height: auto !important;
            }
            
            /* Print margins */
            @page {
                margin: 15mm;
                size: A4 landscape;
            }
            
            /* Background colors for print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            /* Remove footer padding that might cause blank pages */
            .h-32 {
                display: none;
            }
            
            /* Print container styles */
            #print-container {
                position: static !important;
                left: auto !important;
                width: 100% !important;
                padding: 20px !important;
            }
            
            #print-container .mermaid svg {
                max-width: 100% !important;
                height: auto !important;
            }
        }
        
        /* Hide print container on screen */
        #print-container {
            display: none;
        }
        
        @media print {
            #print-container {
                display: block !important;
            }
            #root {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Inline SVG Icons (replacing lucide-react)
        const Icons = {
            ChevronRight: ({ size = 20, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>
            ),
            Menu: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            ),
            X: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            ),
            FileText: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            ),
            RefreshCcw: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
            ),
            Repeat: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            ),
            UserPlus: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            ),
            PlusCircle: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            ),
            Clock: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ),
            Info: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            ),
            ExternalLink: ({ size = 14 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            ),
            ChevronDown: ({ size = 20 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            )
        };

        /**
        * Transaction Flow Portal
        * A robust documentation site for financial transaction workflows.
        */

        const Mermaid = ({ chart }) => {
            const ref = useRef(null);
            const [svg, setSvg] = useState('');

            useEffect(() => {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: 'neutral',
                    securityLevel: 'loose',
                    flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
                    gantt: { useWidth: 1000 }
                });
            }, []);

            useEffect(() => {
                if (ref.current && chart) {
                    const uniqueId = `mermaid-${Math.random().toString(36).substr(2, 9)}`;
                    
                    const renderChart = async () => {
                        try {
                            const { svg: generatedSvg } = await mermaid.render(uniqueId, chart);
                            setSvg(generatedSvg);
                        } catch (err) {
                            console.error("Mermaid render error:", err);
                            setSvg(`<div class="text-red-500 p-4 border border-red-200 rounded bg-red-50 text-sm">
                                <strong>Render Error:</strong> Please check chart syntax.
                            </div>`);
                        }
                    };
                    
                    renderChart();
                }
            }, [chart]);

            return (
                <div className="flex flex-col items-center w-full">
                    <div className="w-full flex justify-center bg-white p-6 rounded-xl border border-slate-200 shadow-sm overflow-x-auto"
                        ref={ref} dangerouslySetInnerHTML={{ __html: svg 
                        || '<div class="text-slate-400 py-10 italic">Generating diagram...</div>' }} />
                </div>
            );
        };

        const SidebarItem = ({ icon: Icon, label, isActive, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 ${
                isActive ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100' }`}>
                <Icon size={20} />
                <span className="font-medium text-sm text-left">{label}</span>
                {isActive && 
                <Icons.ChevronRight size={16} className="ml-auto flex-shrink-0" />}
            </button>
        );

        // Custom print function that exports all flows
        const handleExportPDF = (currentFlow, flows, setSidebarOpen) => {
            // Close sidebar for better layout
            setSidebarOpen(false);
            
            // Create a hidden container with all flows
            const printContainer = document.createElement('div');
            printContainer.id = 'print-container';
            printContainer.style.cssText = `
                position: absolute;
                left: -9999px;
                top: 0;
                width: 1200px;
                background: white;
                padding: 40px;
                font-family: system-ui, -apple-system, sans-serif;
            `;
            
            // Build content for all flows
            let allFlowsHTML = `
                <div style="text-align: center; margin-bottom: 40px; border-bottom: 3px solid #2563eb; padding-bottom: 20px;">
                    <h1 style="font-size: 32px; font-weight: bold; color: #1e293b; margin: 0;">Transaction Flow Portal</h1>
                    <p style="font-size: 16px; color: #64748b; margin-top: 10px;">Complete Process Documentation</p>
                    <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Generated: ${new Date().toLocaleString()}</p>
                </div>
            `;
            
            // Add each flow section
            Object.values(flows).forEach((flow, index) => {
                if (flow.isReference) return; // Skip reference section
                
                allFlowsHTML += `
                    <div style="margin-bottom: 60px; page-break-before: ${index > 0 ? 'always' : 'auto'};">
                        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-left: 4px solid #2563eb; padding-left: 15px;">
                            <h2 style="font-size: 24px; font-weight: bold; color: #1e293b; margin: 0;">${index + 1}. ${flow.title}</h2>
                        </div>
                        <p style="font-size: 14px; color: #475569; margin-bottom: 30px; line-height: 1.6;">${flow.description}</p>
                        ${flow.charts ? flow.charts.map((chart, cidx) => `
                            <div style="margin-bottom: 40px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
                                <h3 style="font-size: 16px; font-weight: 600; color: #334155; margin-bottom: 15px;">${cidx + 1}. ${chart.title}</h3>
                                <div class="mermaid-chart" data-chart="${encodeURIComponent(chart.code)}">
                                    <pre style="background: #1e293b; color: #e2e8f0; padding: 15px; border-radius: 6px; font-size: 12px; overflow-x: auto;">${chart.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
                                </div>
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            });
            
            printContainer.innerHTML = allFlowsHTML;
            document.body.appendChild(printContainer);
            
            // Render mermaid charts in the print container
            setTimeout(() => {
                const chartDivs = printContainer.querySelectorAll('.mermaid-chart');
                let renderCount = 0;
                
                chartDivs.forEach(async (div) => {
                    const code = decodeURIComponent(div.dataset.chart);
                    try {
                        const { svg } = await mermaid.render('print-' + Math.random().toString(36), code);
                        div.innerHTML = svg;
                        renderCount++;
                        
                        // Print when all charts are rendered
                        if (renderCount === chartDivs.length) {
                            setTimeout(() => {
                                window.print();
                                // Cleanup after print
                                setTimeout(() => {
                                    const container = document.getElementById('print-container');
                                    if (container) container.remove();
                                }, 1000);
                            }, 500);
                        }
                    } catch (err) {
                        console.error('Mermaid render error:', err);
                        renderCount++;
                    }
                });
                
                // Fallback if no charts
                if (chartDivs.length === 0) {
                    window.print();
                }
            }, 100);
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('bond');
            const [sidebarOpen, setSidebarOpen] = useState(true);

            const flows = {
                bond: {
                    id: 'bond',
                    title: "Bond Trade Flow (Buy/Sell)",
                    icon: Icons.FileText,
                    description: "Standard operational process for entering, approving, and settling bond trades in the Front, Middle, and Back Office.",
                    charts: [
                        { title: "Overall Trade Lifecycle", code: `flowchart TD\n    Start([Start]) --> Entry["Step 1: Trade Entry<br/>Front Office"]\n    Entry --> Limit{Step 2: Limit Check<br/>System}\n    Limit -->|Pass| Approve["Step 3: Four-Eyes Approval<br/>Middle Office"]\n    Limit -->|Fail| Reject1["Reject Trade"]\n    Approve -->|Approved| ThaiBMA["Step 4: ThaiBMA Reporting<br/>Within 30 min"]\n    Approve -->|Rejected| Reject2["Reject Trade"]\n    ThaiBMA --> Settlement["Step 5: Settlement<br/>Back Office T+2"]\n    Settlement --> Position["6: Position Update"]\n    Position --> EOD["7: Daily EOD Batch"]\n    EOD --> End([End])\n    Reject1 --> End\n    Reject2 --> End` },
                        { title: "Step 1: Front Office Trade Entry Details", code: `flowchart LR\n    subgraph "Step 1: Trade Entry (FO)"\n        E1["Select Portfolio"]\n        E2["Select Security"]\n        E3["Select Counterparty"]\n        E4["Input Nominal Amount"]\n        E5["Input Clean Price"]\n        E6["System calculates:<br/>- Settlement Date T+2<br/>- Yield to Maturity"]\n    end\n    E1 --> E2 --> E3 --> E4 --> E5 --> E6` },
                        { title: "Step 2: System Limit Verification", code: `flowchart TD\n    subgraph "Step 2: Limit Check (System)"\n        L1["Check Counterparty Limit"]\n        L2{"Proposed + Current<br/>> Total Credit Line?"}\n        L3["BLOCK:<br/>Limit Exceeded"]\n        L4{"> 90% of Limit?"}\n        L5["WARNING:<br/>Approaching Limit"]\n        L6["PASS:<br/>Proceed to Approval"]\n        L7["Create Limit Utilization Record"]\n    end\n    L1 --> L2\n    L2 -->|Yes| L3\n    L2 -->|No| L4\n    L4 -->|Yes| L5 --> L6\n    L4 -->|No| L6\n    L6 --> L7` },
                        { title: "Step 5: Back Office Settlement Process", code: `flowchart TD\n    subgraph "Step 5: Settlement (BO)"\n        S1["T+2 Settlement Date"]\n        S2{"Settlement System?"}\n        S3["TSD:<br/>SWIFT MT540/MT541"]\n        S4["BAHTNET:<br/>Manual Portal Upload"]\n        S5["Receive Confirmation"]\n        S6["Update Status:<br/>SETTLED"]\n        S7{Failed?}\n        S8["Status: FAILED<br/>Exception Handling"]\n    end\n    S1 --> S2\n    S2 -->|Corporate Bond| S3\n    S2 -->|Govt Bond| S4\n    S3 --> S5\n    S4 --> S5\n    S5 --> S6\n    S5 -->|No Confirm| S7\n    S7 -->|Yes| S8` }
                    ]
                },
                interbank: {
                    id: 'interbank',
                    title: "Interbank Deal Flow (Lend/Borrow)",
                    icon: Icons.RefreshCcw,
                    description: "Short-term liquidity management through lending or borrowing with interbank counterparties.",
                    charts: [
                        { title: "Interbank Transaction Lifecycle", code: `flowchart TD\n    Start([Start]) --> Entry["Step 1: Deal Entry<br/>Front Office"]\n    Entry --> Limit{Step 2: Limit Check<br/>System}\n    Limit -->|Pass| Approve["Step 3: Approval<br/>Middle Office"]\n    Limit -->|Fail| Reject1["Reject"]\n    Approve -->|Approved| Settlement["Step 4: Settlement<br/>Back Office"]\n    Approve -->|Rejected| Reject2["Reject"]\n    Settlement --> Accrual["Step 5: Daily Accrual<br/>System 18:00"]\n    Accrual --> Maturity{Maturity Date?}\n    Maturity -->|Yes| Close["Step 6: Maturity<br/>Principal + Interest"]\n    Maturity -->|No| Accrual\n    Close --> End([End])\n    Reject1 --> End\n    Reject2 --> End` },
                        { title: "Step 1: Interbank Deal Entry Requirements", code: `flowchart LR\n    subgraph "Step 1: Deal Entry (FO)"\n        IE1["Select Deal Type:<br/>LEND or BORROW"]\n        IE2["Select Counterparty"]\n        IE3["Input Principal Amount"]\n        IE4["Input Value Date &<br/>Maturity Date"]\n        IE5["Select Rate Type:<br/>FIXED or FLOATING"]\n        IE6["Input Interest Rate<br/>(or Reference Rate + Margin)"]\n        IE7["System calculates Term"]\n    end\n    IE1 --> IE2 --> IE3 --> IE4 --> IE5 --> IE6 --> IE7` }
                    ]
                },
                repo: {
                    id: 'repo',
                    title: "Repo Trade Flow (Repo/Reverse Repo)",
                    icon: Icons.Repeat,
                    description: "Secured funding workflows including collateral allocation and margin management.",
                    charts: [
                        { title: "End-to-End Repo Cycle", code: `flowchart TD\n    Start([Start]) --> Entry["Step 1: Trade Entry"]\n    Entry --> Limit{Limit Check}\n    Limit -->|Pass| Approve["Step 3: Approval"]\n    Approve -->|Approved| Collateral["Step 4: Collateral Allocation"]\n    Collateral --> Settlement1["Step 5: First Leg Settlement"]\n    Settlement1 --> Active["Status: ACTIVE"]\n    Active --> MTM["Step 6: Daily MTM"]\n    MTM --> Margin{Margin Check}\n    Margin -->|Threshold Breached| Call["Step 7: Margin Call"]\n    Margin -->|OK| Accrual["Step 8: Daily Accrual"]\n    Call --> Accrual\n    Accrual --> Maturity{Maturity Date?}\n    Maturity -->|Yes| Settlement2["Step 9: Second Leg Settlement"]\n    Maturity -->|No| MTM\n    Settlement2 --> End([End])` },
                        { title: "Step 4: Collateral Allocation Logic", code: `flowchart LR\n    subgraph "Step 4: Collateral Allocation (BO)"\n        C1["Calculate Required Collateral<br/>Nominal / (1 - Haircut)"]\n        C2["Select Securities<br/>from Inventory"]\n        C3["Apply Haircut %<br/>by Rating/Tenor"]\n        C4{"Collateral Value<br/>>= Repo Exposure?"}\n        C5["✅ Allocate Collateral"]\n        C6["❌ Request More<br/>or Different Securities"]\n    end\n    C1 --> C2 --> C3 --> C4\n    C4 -->|Yes| C5\n    C4 -->|No| C6 --> C2` }
                    ]
                },
                bond_setup: {
                    id: 'bond_setup',
                    title: "New Bond Setup Flow",
                    icon: Icons.PlusCircle,
                    description: "Adding new securities to the internal master data system, ensuring correct haircut and pricing parameters.",
                    charts: [
                        { title: "Setup Workflow", code: `flowchart TD\n    Start([Start]) --> B1["Step 1: Security Master Setup<br/>Back Office"]\n    B1 --> B2["Step 2: Haircut Configuration<br/>Back Office<br/>(if Repo eligible)"]\n    B2 --> B3["Step 3: System Configuration<br/>IT Admin"]\n    B3 --> B4["Step 4: Initial Price Import<br/>Back Office"]\n    B4 --> End([✅ Ready for Trading])` },
                        { title: "Implementation Timeline", code: `gantt\n    title New Bond Setup Timeline\n    dateFormat YYYY-MM-DD\n    section Back Office\n        Master Data Entry       :b1, 2026-02-01, 1d\n        Haircut Config          :b2, after b1, 4h\n    section IT Admin\n        System Parametrization  :b3, after b2, 4h\n    section Finalization\n        Initial Pricing         :b4, after b3, 2h` }
                    ]
                },
                onboarding: {
                    id: 'onboarding',
                    title: "Client Onboarding Flow",
                    icon: Icons.UserPlus,
                    description: "The workflow for verifying and setting up new institutional counterparties.",
                    charts: [
                        { title: "KYC & Credit Approval Workflow", code: `flowchart TD\n    Start([Start]) --> S1["Step 1: Entity Setup<br/>Back Office"]\n    S1 --> S2["Step 2: Counterparty Setup<br/>Back Office"]\n    S2 --> S3["Step 3: Credit Risk Assessment<br/>Credit Risk Team"]\n    S3 -->|Approved| S4["Step 4: Limit Configuration<br/>Middle Office"]\n    S3 -->|Rejected| Reject["Reject Onboarding"]\n    S4 --> S5["Step 5: Netting Agreement<br/>Back Office<br/>(if Repo trading)"]\n    S5 --> S6["Step 6: KYC Approval<br/>Compliance"]\n    S6 -->|Approved| End([✅ Ready to Trade])\n    S6 -->|Rejected| Reject\n    Reject --> End2([❌ Onboarding Failed])` },
                        { title: "Standard Onboarding Timeline", code: `gantt\n    title Client Onboarding Timeline (3-5 Business Days)\n    dateFormat YYYY-MM-DD\n    section Back Office\n        Entity Setup            :a1, 2026-02-01, 1d\n        Counterparty Setup      :a2, after a1, 1d\n        Netting Agreement       :a5, after a4, 1d\n    section Credit Risk\n        Credit Assessment       :a3, after a2, 2d\n    section Middle Office\n        Limit Configuration     :a4, after a3, 1d\n    section Compliance\n        KYC Approval            :a6, after a5, 1d` }
                    ]
                },
                portfolio: {
                    id: 'portfolio',
                    title: "Portfolio Setup Flow",
                    icon: Icons.PlusCircle,
                    description: "Create trading portfolios with accounting classification (AMC, FVOCI, FVTPL) before trading begins.",
